global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'spring-boot-app-ec2'
    static_configs:
      - targets: ['${APP_SERVER_HOST}:8080']  # EC2 App 서버 IP로 교체
    metrics_path: '/actuator/prometheus'
    scrape_interval: 5s
    
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']