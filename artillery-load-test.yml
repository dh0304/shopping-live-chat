scenarios:
  # 관찰자 (70%): 30초-2분 연결, 채팅 안함
  - name: "observers"
    weight: 70
    flow:
      - function: "setUserData"
      - post:
          url: "/api/auth/login"
          json:
            nickname: "{{ nickname }}"
          afterResponse: "saveCookie"
      - get:
          url: "/api/chat-rooms"
          capture:
            - json: "$[0].id"
              as: "roomId"
      - function: "connectWebSocketAndChat"
      # 30초-120초 랜덤 대기 (관찰만)
      - think: "{{ $randomInt(30, 120) }}"
      
  # 참여자 (25%): 2-4분 연결, 중간에 채팅 참여
  - name: "participants"  
    weight: 25
    flow:
      - function: "setUserData"
      - post:
          url: "/api/auth/login"
          json:
            nickname: "{{ nickname }}"
          afterResponse: "saveCookie"
      - get:
          url: "/api/chat-rooms"
          capture:
            - json: "$[0].id"
              as: "roomId"
      - function: "connectWebSocketWithParticipation"
      # 2-3분 대기 (관찰)
      - think: "{{ $randomInt(120, 180) }}"
      # 30초-1분간 채팅은 함수 내에서 처리
      - think: "{{ $randomInt(60, 120) }}"

  # 구매자 (5%): 8분 연결, 4분30초에 채팅이벤트 참여
  - name: "buyers"
    weight: 5
    flow:
      - function: "setUserData"
      - post:
          url: "/api/auth/login"
          json:
            nickname: "{{ nickname }}"
          afterResponse: "saveCookie"
      - get:
          url: "/api/chat-rooms"
          capture:
            - json: "$[0].id"
              as: "roomId"
      - function: "connectWebSocketWithBuying"
      # 4분 30초 대기 (관찰)
      - think: 270
      # 구매 관련 채팅은 함수 내에서 처리
      - think: 90