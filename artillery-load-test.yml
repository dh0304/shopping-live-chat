config:
  target: 'http://192.168.0.46:8080'
  phases:
    # duration 60, arrivalRate 5, rampTo 10라면
    # 시작: 초당 5명의 새 사용자 생성
    # 60초 동안 점진적으로 증가
    # 끝: 초당 10명의 새 사용자 생성

    # 기존 설정 (서버 다운 위험)
     - duration: 30
       arrivalRate: 100
       rampTo: 100
       name: "initial_entry"
     - duration: 120
       arrivalRate: 100
       rampTo: 67
       name: "gradual_entry"
     - duration: 60
       arrivalRate: 67
       rampTo: 33
       name: "peak_users"
     - duration: 240
       arrivalRate: 33
       name: "stable_phase"
     - duration: 30
       arrivalRate: 33
       rampTo: 0
       name: "ending"
  processor: "./artillery-functions.js"
  ws:
    # WebSocket 연결 설정
    subprotocols: [ ]

