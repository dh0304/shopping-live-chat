# /etc/nginx/conf.d/default.conf
# HTTP 요청을 HTTPS로 리다이렉트
server {
    listen        80 default_server;
    listen        [::]:80 default_server;
    server_name   tecdev.shop;
    return 301    https://$host$request_uri;
}

# HTTPS 서비스 블록
server {
    listen        443 ssl http2 default_server;
    listen        [::]:443 ssl http2 default_server;
    server_name   tecdev.shop;

    # React 정적 파일 서빙용 root
    root /usr/share/nginx/html;
    index index.html;

    # SSL 설정 (Certbot 관리)
    ssl_certificate     /etc/letsencrypt/live/tecdev.shop/fullchain.pem;  # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/tecdev.shop/privkey.pem;      # managed by Certbot

    # TLS 프로토콜 설정
    ssl_protocols TLSv1.2 TLSv1.3;

    # HSTS 헤더
    add_header Strict-Transport-Security "max-age=31536000" always;

    # SSL 세션 캐싱
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 정적 리소스 브라우저 캐싱
    location ~* \.(?:css|js|gif|png|jpg|jpeg|svg|ico|woff|woff2|ttf|eot)$ {
        expires 1y;
        access_log off;
    }

    # React 라우팅을 위한 fallback (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 요청들은 백엔드로 프록시
    location /api/ {
        proxy_set_header    X-Forwarded-For $remote_addr;
        proxy_set_header    Host            $http_host;
        proxy_pass          http://192.168.0.19:8080;
    }

    # WebSocket 연결을 위한 프록시 (STOMP)
    location /ws/ {
        proxy_set_header    X-Forwarded-For $remote_addr;
        proxy_set_header    Host            $http_host;
        proxy_set_header    Upgrade $http_upgrade;
        proxy_set_header    Connection "upgrade";
        proxy_pass          http://192.168.0.19:8080;
    }

    # 기타 include, 에러 페이지 등
    include /etc/nginx/default.d/*.conf;
    error_page 404 /404.html;
    location = /40x.html { }
    error_page 500 502 503 504 /50x.html;
    location = /50x.html { }
}
