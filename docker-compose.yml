services:
  mysql:
    image: mysql:8.0
    container_name: shopping-live-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: shopping_live
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p1234"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '2'
    #       memory: 4G
    #     reservations:
    #       cpus: '2'
    #       memory: 4G

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shopping-live-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/shopping_live
      - SPRING_DATASOURCE_PASSWORD=1234
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '2'
    #       memory: 4G
    #     reservations:
    #       cpus: '2'
    #       memory: 4G

  artillery:
    build:
      context: .
      dockerfile: artillery.Dockerfile
    container_name: artillery-load-test
    depends_on:
      backend:
        condition: service_started
    profiles:
      - test

volumes:
  mysql_data: